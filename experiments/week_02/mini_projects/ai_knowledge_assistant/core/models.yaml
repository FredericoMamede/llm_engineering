# Model Registry Configuration
# Add any OpenAI-compatible provider here.
# For each model: set the env var for the API key, and it will auto-register.

models:
  # OpenAI
  GPT-4o-mini:
    provider: openai
    model: gpt-4o-mini
    api_key_env: OPENAI_API_KEY
    base_url: null  # uses default
    supports_tools: true
    
  GPT-4o:
    provider: openai
    model: gpt-4o
    api_key_env: OPENAI_API_KEY
    base_url: null
    supports_tools: true

  # DeepSeek (OpenAI-compatible)
  DeepSeek:
    provider: deepseek
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    supports_tools: true

  # Anthropic Claude (OpenAI-compatible via their proxy)
  # Note: Native Anthropic SDK would need separate handling
  Claude-Sonnet:
    provider: anthropic
    model: claude-sonnet-4-20250514
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com/v1
    supports_tools: true
    extra_headers:
      anthropic-version: "2023-06-01"

  # Google Gemini (OpenAI-compatible endpoint)
  Gemini-Flash:
    provider: google
    model: gemini-2.0-flash
    api_key_env: GOOGLE_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    supports_tools: true

  # Groq (OpenAI-compatible, fast inference)
  Groq-Llama:
    provider: groq
    model: llama-3.3-70b-versatile
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    supports_tools: true

  # Together AI (OpenAI-compatible)
  Together-Llama:
    provider: together
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
    api_key_env: TOGETHER_API_KEY
    base_url: https://api.together.xyz/v1
    supports_tools: true

  # Mistral (OpenAI-compatible)
  Mistral-Large:
    provider: mistral
    model: mistral-large-latest
    api_key_env: MISTRAL_API_KEY
    base_url: https://api.mistral.ai/v1
    supports_tools: true

  # Ollama (local, auto-detected)
  Ollama:
    provider: ollama
    model: llama3.2
    api_key_env: null  # no key needed
    base_url: http://localhost:11434/v1
    supports_tools: false
    local: true  # requires connectivity check

