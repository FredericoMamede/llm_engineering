# Canonical Requirement Scope for AI-First MERN Fullstack Developer (Eventyr)
# This file is the authoritative source for all 22 requirements

requirements:
  core:
    - id: 1
      text: "4+ years of commercial experience in fullstack TypeScript development"
      category: "experience"
      priority: "required"
      knowledge_domains:
        - "TypeScript fundamentals and advanced patterns"
        - "Fullstack architecture patterns"
        - "Commercial development practices"
    
    - id: 2
      text: "Strong experience with React 18 and modern React patterns (hooks, context, TanStack Query)"
      category: "frontend"
      priority: "required"
      knowledge_domains:
        - "React 18 features and patterns"
        - "React Hooks (useState, useEffect, useContext, custom hooks)"
        - "Context API and state management"
        - "TanStack Query (React Query) for data fetching"
        - "Modern React best practices"
    
    - id: 3
      text: "Production experience with Node.js and NestJS (or similar opinionated frameworks)"
      category: "backend"
      priority: "required"
      knowledge_domains:
        - "Node.js runtime and event loop"
        - "NestJS framework architecture"
        - "Dependency injection patterns"
        - "Module organization and structure"
        - "Alternative opinionated frameworks (Express with structure, Fastify)"
    
    - id: 4
      text: "Solid knowledge of PostgreSQL — schema design, migrations, query optimization, JSONB"
      category: "database"
      priority: "required"
      knowledge_domains:
        - "PostgreSQL schema design principles"
        - "Database migrations and versioning"
        - "Query optimization and indexing"
        - "JSONB data type and operations"
        - "PostgreSQL-specific features"
    
    - id: 5
      text: "Experience with Redis for caching, pub/sub, or job queues"
      category: "infrastructure"
      priority: "required"
      knowledge_domains:
        - "Redis caching strategies"
        - "Redis pub/sub patterns"
        - "Redis for job queues"
        - "Redis data structures and commands"
    
    - id: 6
      text: "Understanding of REST API design and authentication (JWT, OAuth flows)"
      category: "api"
      priority: "required"
      knowledge_domains:
        - "REST API design principles"
        - "JWT token authentication"
        - "OAuth 2.0 flows"
        - "API security best practices"
    
    - id: 7
      text: "Experience integrating third-party APIs (payment gateways, external services)"
      category: "integration"
      priority: "required"
      knowledge_domains:
        - "Third-party API integration patterns"
        - "Payment gateway integration (Stripe, PayPal, etc.)"
        - "Error handling and retry logic"
        - "API rate limiting and throttling"
    
    - id: 8
      text: "Familiarity with AI/LLM APIs (OpenAI, Claude, or similar) — prompt engineering basics"
      category: "ai"
      priority: "required"
      knowledge_domains:
        - "OpenAI API usage"
        - "Anthropic Claude API"
        - "Prompt engineering fundamentals"
        - "LLM integration patterns"
    
    - id: 9
      text: "Product thinking: understanding why you're building, not just how"
      category: "soft_skills"
      priority: "required"
      knowledge_domains:
        - "Product development mindset"
        - "User-centric thinking"
        - "Business value alignment"
        - "Technical decision making with product context"
    
    - id: 10
      text: "Ability to work autonomously in a fast-paced startup environment"
      category: "soft_skills"
      priority: "required"
      knowledge_domains:
        - "Autonomous work patterns"
        - "Startup environment dynamics"
        - "Fast-paced development practices"
        - "Self-direction and ownership"
    
    - id: 11
